[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekship"
version = "0.1.0"
description = "Turn a week of merged PRs, commits and releases into release notes, an owner brief and a shareable post, with a hard count of agent-authored vs human-authored work."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Joshua Warren" }]
keywords = ["changelog", "release-notes", "github", "ai-agents", "what-shipped"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weekship = "weekship.cli:main"

[project.urls]
Homepage = "https://github.com/joshuaswarren/weekship"
Issues = "https://github.com/joshuaswarren/weekship/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
